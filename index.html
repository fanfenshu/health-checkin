<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#22262d;--sub:#7a808a;--line:#ece8e0;--ok:#22b46b;--warn:#f0a020;--miss:#fff4e6;--radius:20px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 12px) 14px calc(var(--sab) + 92px)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(50,40,20,.06)}
.muted{color:var(--sub)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.topbar{display:flex;align-items:center;gap:6px;margin:2px 2px 12px}
.topbar .d{flex:1;text-align:center}
.topbar .d b{font-size:19px;font-weight:800}
.topbar .d div{font-size:12px;color:var(--sub)}
.navbtn{width:44px;height:44px;border-radius:14px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.05);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.navbtn:disabled{opacity:.3}
.todaybtn{font-size:12px;font-weight:700;color:#ff6b6b;background:#fff0ee;border-radius:999px;padding:3px 10px;margin-top:3px;display:inline-block}
.previewbanner{display:flex;align-items:center;gap:10px;background:#eef3ff;border:1px solid #d5e0ff;border-radius:14px;padding:10px 14px;margin-bottom:14px;color:#3a56b0;font-size:13.5px;font-weight:700}
.previewbanner .e{font-size:22px}
.task.preview,.slot.preview,.toggle.preview{opacity:.72;pointer-events:none;cursor:default}
.task.preview:active{background:transparent}

.cat{padding:0;overflow:hidden}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(var(--sab) + 6px);z-index:20}

const WCH = '一二三四五六日';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

// 时钟（测试用：?now=2026-10-12T09:30 模拟时间）
let clockOffset = 0;
try { const q = new URLSearchParams(location.search).get('now'); if (q) { const t = new Date(q).getTime(); if (!isNaN(t)) clockOffset = t - Date.now(); } } catch (e) {}
const now = () => Date.now() + clockOffset;

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const wdOf = k => parseKey(k).getDay();
const todayKey = () => keyOf(new Date(now() - CONFIG.dayStartHour * 3600e3));
const hm2min = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const min2hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtMD = k => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日`; };
function at(k, hm) { const d = parseKey(k); let m = hm2min(hm); if (m < CONFIG.dayStartHour * 60) m += 1440; return d.getTime() + m * 60e3; }

  const d = diffDays(todayKey(), k);
  if (d === 0) return '今天';
  if (d === -1) return '昨天';

  if (d === 1) return '明天';
  if (d === 2) return '后天';
  if (d < 0) return `${-d} 天前`;
  return `${d} 天后`;
}

const isPastDay = k => k < todayKey();

    return o;
  });
  return { categories, tasks };
}

function loadCfg() {
  let c = null; try { c = JSON.parse(localStorage.getItem(CFG_KEY)); } catch (e) {}

}

const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a.toFixed(2)})`; };

function barChart(vals, days, tk, colFn, lines, minMax, evs) {

function lineChart(pts, col, goal, id) {
  const W = 320, H = 170, l = 34, r = 14, t = 18, b = 26;
  const vs = pts.map(p => p[1]).concat(goal ? [goal] : []);
  let mn = Math.min(...vs), mx = Math.max(...vs); if (mx - mn < 4) { const m = (mx + mn) / 2; mn = m - 2; mx = m + 2; }
  const pd = (mx - mn) * .12; mn -= pd; mx += pd;
  const n = pts.length, x = i => n === 1 ? (l + W - r) / 2 : l + 6 + (W - l - r - 12) * i / (n - 1), y = v => t + (H - t - b) * (1 - (v - mn) / (mx - mn));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="lg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  for (let i = 0; i <= 3; i++) { const v = mn + (mx - mn) * i / 3; s += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="#eee9e0"/><text x="${l - 5}" y="${y(v) + 3}" font-size="9.5" text-anchor="end" fill="#9aa0a8">${v.toFixed(0)}</text>`; }
  if (goal) s += `<line x1="${l}" x2="${W - r}" y1="${y(goal)}" y2="${y(goal)}" stroke="#22b46b" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - r}" y="${y(goal) - 4}" font-size="10" text-anchor="end" fill="#22b46b" font-weight="700">目标 ${goal}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  if (n > 1) s += `<path d="${path} L${x(n - 1)},${H - b} L${x(0)},${H - b}Z" fill="url(#lg${id})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const step = Math.ceil(n / 6);
  pts.forEach((p, i) => {
    s += `<circle cx="${x(i)}" cy="${y(p[1])}" r="4.5" fill="#fff" stroke="${col}" stroke-width="2.5"/>`;
    if (i === n - 1 || i === 0) s += `<text x="${x(i)}" y="${y(p[1]) - 9}" font-size="11" font-weight="800" text-anchor="middle" fill="#22262d">${p[1]}</text>`;
    if (i % step === 0 || i === n - 1) { const d = parseKey(p[0]); s += `<text x="${x(i)}" y="${H - 8}" font-size="9.5" text-anchor="middle" fill="#8a8f98">${d.getMonth() + 1}/${d.getDate()}</text>`; }
  });
  return s + `</svg>`;
}

function buildTask(d) {
  const t = { id: d.id, cat: d.cat, type: d.type, title: (d.title || '').trim(), desc: (d.desc || '').trim(), icon: (d.icon || '').trim(), core: !!d.core };

  if (!d.sel.length) return '至少选一天';
  if (['check', 'number', 'weigh'].includes(t.type) && d.timed && d.time) { t.time = d.time; if (t.type === 'check' && d.end && d.end !== d.time) t.end = d.end; }
  if (t.type === 'multi') {
    t.slots = d.slots.map(s => s || ''); if (!t.slots.length) return '至少打卡一次';
    t.xpEach = toInt(d.xpEach, 5); t.xpAll = toInt(d.xpAll, 0);
  } else t.xp = toInt(d.xp, 10);
  if (t.type === 'piano') {
    t.goalMin = Math.max(1, toInt(d.goalMin, 30)); t.bonusMin = toInt(d.bonusMin, 0); t.bonusXp = toInt(d.bonusXp, 0);
    if (t.bonusMin && t.bonusMin <= t.goalMin) return '奖励分钟要比达标分钟多（不需要就填 0）';

  if (t.type === 'number') t.unit = (d.unit || '').trim();
  if (d.vary && ['check', 'toggle', 'number'].includes(t.type)) {
    t.byWeekday = {};
    for (const x of d.sel) {
      const e = d.wk[x] || {}, o = { title: (e.title || '').trim() || t.title };
      if ((e.icon || '').trim()) o.icon = e.icon.trim();
      if ((e.desc || '').trim()) o.desc = e.desc.trim();
      if (e.xp !== '' && e.xp != null && !isNaN(parseInt(e.xp, 10))) o.xp = toInt(e.xp, t.xp);

function stopTimerFor(id) { if (S.timer && timerId() === id) { addSec(dayRec(S.timer.day), id, timerMs() / 1000); S.timer = null; save(); } }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act^="e-"]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;

    case 'e-cat': { const c = id && cfgFor(todayKey()).categories.find(x => x.id === id); openSheet(catDraft(c)); break; }
    case 'e-set': {
      readSheet(); const f = el.dataset.f, v = el.dataset.v;
      if (f === 'timed') draft.timed = v === 'true';
      else if (f === 'preset') draft.sel = v === 'all' ? [0, 1, 2, 3, 4, 5, 6] : v === 'work' ? [1, 2, 3, 4, 5] : [0, 6];
      else draft[f] = v;
      renderSheet(); break;
    }
    case 'e-tog': readSheet(); draft[el.dataset.f] = !draft[el.dataset.f]; renderSheet(); break;
    case 'e-day': { readSheet(); const x = +el.dataset.v, i = draft.sel.indexOf(x); if (i >= 0) draft.sel.splice(i, 1); else draft.sel.push(x); renderSheet(); break; }
    case 'e-slotadd': readSheet(); draft.slots.push(''); renderSheet(); break;
    case 'e-slotdel': readSheet(); draft.slots.splice(+el.dataset.i, 1); renderSheet(); break;
    case 'e-save': {
      readSheet(); const d = draft;
      if (d.kind === 'cat') {
        const c = { id: d.id, name: (d.name || '').trim(), emoji: (d.emoji || '').trim() || '📌', color: d.color, sub: (d.sub || '').trim() };
        if (!c.name) { toast('请填写分类名称'); break; }
        editCfg(v => { const i = v.categories.findIndex(x => x.id === c.id); if (i >= 0) v.categories[i] = { ...v.categories[i], ...c }; else v.categories.push(c); });
        closeSheet(); render(); toast(d.isNew ? `✅ 已添加分类「${c.name}」` : '✅ 已保存', d.isNew ? '接着点「添加任务」往里加任务' : '');
      } else {

          else { if (i >= 0) v.tasks.splice(i, 1); v.tasks.push(t); }
        });
        if (t.type !== 'piano') stopTimerFor(t.id);
        closeSheet(); render(); toast(d.isNew ? `✅ 已添加「${t.title}」` : '✅ 已保存', '今天起生效');
      }
      break;
    }
    case 'e-del': {

      if (d.kind === 'cat') {
        const n = cfgFor(todayKey()).tasks.filter(t => t.cat === d.id).length;
        if (!confirm(`删除分类「${d.name}」${n ? `和里面的 ${n} 项任务` : ''}？\n以前打过的卡会保留在历史里，只是以后不再显示。`)) break;
        cfgFor(todayKey()).tasks.filter(t => t.cat === d.id).forEach(t => stopTimerFor(t.id));
        editCfg(v => { v.categories = v.categories.filter(c => c.id !== d.id); v.tasks = v.tasks.filter(t => t.cat !== d.id); });
      } else {
        if (!confirm(`删除任务「${d.title}」？\n以前打过的卡会保留在历史里，只是以后不再显示。`)) break;
        stopTimerFor(d.id);
        editCfg(v => { v.tasks = v.tasks.filter(t => t.id !== d.id); });
      }
      closeSheet(); render(); toast('🗑 已删除'); break;
    }
    case 'e-cmove': editCfg(v => { const i = v.categories.findIndex(c => c.id === id), j = i + +el.dataset.n; if (i < 0 || j < 0 || j >= v.categories.length) return; [v.categories[i], v.categories[j]] = [v.categories[j], v.categories[i]]; }); render(); break;
    case 'e-tmove': editCfg(v => {
      const i = v.tasks.findIndex(t => t.id === id); if (i < 0) return;
      const same = v.tasks.map((t, n) => t.cat === v.tasks[i].cat ? n : -1).filter(n => n >= 0), p = same.indexOf(i), j = same[p + +el.dataset.n];
      if (j == null) return; [v.tasks[i], v.tasks[j]] = [v.tasks[j], v.tasks[i]];
    }); render(); break;
    case 'e-reset':
      if (!confirm('把分类和任务恢复成最初的健康计划？\n你自己加的分类和任务会被替换（今天起生效），打卡记录不会删除。')) break;
      editCfg(v => { const s = seedConfig(); v.categories = s.categories; v.tasks = s.tasks; });
      render(); toast('↩️ 已恢复默认任务'); break;
  }
});
/* ===================================================================== */
function render() {
  $('#app').innerHTML = view === 'today' ? renderToday() : view === 'week' ? renderWeek() : view === 'records' ? renderRecords() : view === 'edit' ? renderEdit() : renderSettings();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === view));
  justDone = null;
  const fi = $('#importFile');
  if (fi) fi.onchange = ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(rd.result); rd.readAsText(f); };
}
function takeSnap() { const k = todayKey(), e = evalDay(k); return { k, cats: Object.fromEntries(Object.entries(e.cats).map(([id, c]) => [id, c.complete])), perfect: e.perfect, lit: e.lit }; }
function celebrate() {
  const s = takeSnap(); let delay = 0;
  if (snap && snap.k === s.k) {
    if (s.perfect && !snap.perfect) { confetti(240); toast('💯 完美一天！', `全部完成 · 额外 +${CONFIG.xp.perfect} XP`); delay = 2800; }
    else if (s.lit && !snap.lit) { confetti(170); toast('🔥 今天已点亮！', `火苗 +1 · 额外 +${CONFIG.xp.dayLit} XP`); delay = 2800; }
    else for (const id in s.cats) if (s.cats[id] && !snap.cats[id]) { const c = catOf(id, s.k); confetti(90, c.color); toast(id === 'piano' && c.name === '练琴' ? '🎹 今天练琴达标！' : `${c.emoji} ${c.name} 全部完成！`, `分类奖励 +${CONFIG.xp.catBonus} XP`); delay = 2800; break; }
  }
  snap = s;
  const st = totals(), fresh = [];
  for (const b of CONFIG.badges) if (!S.badges[b.id] && (st[b.stat] || 0) >= b.goal) { S.badges[b.id] = todayKey(); fresh.push(b); }
  if (fresh.length) { save(); setTimeout(() => { confetti(160, '#f0b23a'); toast(`🏅 解锁徽章：${fresh[0].e} ${fresh[0].name}`, fresh.length > 1 ? `还有 ${fresh.length - 1} 个新徽章，去「本周」看看` : fresh[0].desc); }, delay); }
}
function floatXp(el, n) {
  if (!el || !n) return; const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'floatxp'; d.textContent = (n > 0 ? '+' : '') + n + ' XP';
  if (n < 0) d.style.color = '#9aa0a8';
  d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = (r.top + 4) + 'px';
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
let toastT;
function toast(a, b) { const t = $('#toast'); t.innerHTML = esc(a) + (b ? `<small>${esc(b)}</small>` : ''); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// 彩带
const fx = $('#fx'), ctx = fx.getContext('2d'); let parts = [], raf = null;
function sizeFx() { const dpr = devicePixelRatio || 1; fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function confetti(n = 120, main) {
  if (!raf) sizeFx();
  const cols = main ? [main, main, '#ffd34d', '#ff7a8a', '#8f6bff'] : ['#ff9a5c', '#ff6b88', '#8f6bff', '#22b46b', '#ffd34d', '#4f6fe0'];
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 10; parts.push({ x: innerWidth / 2, y: innerHeight * .4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 }); }
  if (!raf) raf = requestAnimationFrame(tickFx);
}
function tickFx() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 30 && p.life < 200);
  for (const p of parts) { p.life++; p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life / 200); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
  if (parts.length) raf = requestAnimationFrame(tickFx); else { ctx.clearRect(0, 0, innerWidth, innerHeight); raf = null; }
}

// 交互
function mutate(k, fn, anchorSel) {
  const before = evalDay(k).xp; fn(); save();
  const gain = evalDay(k).xp - before; render();
  if (gain) floatXp(typeof anchorSel === 'string' ? $(anchorSel) : anchorSel, gain);
  celebrate();
}
function clampViewDay(k) {
  if (k < CONFIG.startDate) return CONFIG.startDate;
  const max = maxFutureKey();
  return k > max ? max : k;
}
function shiftDay(n) { viewDay = clampViewDay(addDays(viewDay, n)); pastEdit = false; render(); scrollTo(0, 0); }
function guardWritable(k) {
  if (isFutureDay(k)) { toast('👀 这是预览', '到当天再打卡'); return false; }
  return true;
}
document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { view = tab.dataset.tab; if (view === 'today') { viewDay = todayKey(); pastEdit = false; } if (view === 'week') weekOf = todayKey(); exportText = ''; render(); scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const a = el.dataset.act, k = viewDay, task = id => tasksFor(k).find(t => t.id === id);
  switch (a) {
    case 'day': shiftDay(+el.dataset.n); break;
    case 'gotoday': viewDay = todayKey(); pastEdit = false; render(); scrollTo(0, 0); break;
    case 'openday': {
      const dk = el.dataset.k;
      if (dk < CONFIG.startDate || dk > maxFutureKey()) return;
      viewDay = dk; view = 'today'; pastEdit = false; render(); scrollTo(0, 0); break;
    }
    case 'week': weekOf = addDays(weekOf, +el.dataset.n); render(); break;
    case 'thisweek': weekOf = todayKey(); render(); break;
    case 'check': { if (!guardWritable(k)) break; const t = task(el.dataset.id); if (!t) break; mutate(k, () => { const r = dayRec(k); if (r.t[t.id]) delete r.t[t.id]; else { r.t[t.id] = now(); justDone = t.id; } }, `[data-id="${t.id}"]`); break; }
    case 'slot': { if (!guardWritable(k)) break; const t = task(el.dataset.id), i = +el.dataset.i; if (!t) break; mutate(k, () => { const r = dayRec(k), arr = r.m[t.id] = r.m[t.id] || [], j = arr.indexOf(i); if (j >= 0) { arr.splice(j, 1); if (r.mts && r.mts[t.id]) delete r.mts[t.id][i]; } else { arr.push(i); r.mts = r.mts || {}; r.mts[t.id] = r.mts[t.id] || {}; r.mts[t.id][i] = now(); justDone = t.id + ':' + i; } }, `[data-id="${t.id}"][data-i="${i}"]`); break; }
    case 'tstart': {
      const id = el.dataset.id || 'piano';
      if (S.timer && timerId() !== id) { const ot = tasksFor(S.timer.day).find(t => t.id === timerId()); toast(`先结束「${ot ? ot.title : '上一个'}」的计时`, '同一时间只能计一项'); break; }
      if (!S.timer) S.timer = { id, day: todayKey(), accMs: 0, startTs: now() }; else if (!S.timer.startTs) S.timer.startTs = now(); save(); render(); break;
    }
    case 'tpause': if (S.timer && S.timer.startTs) { S.timer.accMs += now() - S.timer.startTs; S.timer.startTs = null; } save(); render(); break;
    case 'tstop': stopTimer(); break;
    case 'padd': { if (!guardWritable(k)) break; const n = +el.dataset.n, id = el.dataset.id || 'piano', t = task(id); if (!t) break; mutate(k, () => { const r = dayRec(k), cur = taskSec(k, id); addSec(r, id, Math.max(n * 60, -cur)); if (n > 0) toast(`${t.icon || '⏱️'} ${t.title} +${n} 分钟`, `今天累计 ${Math.floor(taskSec(k, id) / 60)} 分钟`); }, `[data-act="padd"][data-id="${id}"][data-n="${n}"]`); break; }
    case 'nsave': { if (!guardWritable(k)) break; const id = el.dataset.id, t = task(id), inp = $('#num_' + id); if (!t || !inp) break; const raw = inp.value.trim(), v = parseFloat(raw);
      if (raw && isNaN(v)) { toast('请输入数字'); break; } inp.blur();
      mutate(k, () => { const r = dayRec(k); r.n = r.n || {}; if (raw === '') delete r.n[id]; else { r.n[id] = v; justDone = id; } }, `[data-act="nsave"][data-id="${id}"]`);
      if (raw !== '' && !$('.toast.show')) toast('✅ 已记录', `${t.title} ${v} ${t.unit || ''}`); break; }
    case 'pastedit': pastEdit = true; render(); scrollTo(0, 0); break;
    case 'pastdone': pastEdit = false; render(); scrollTo(0, 0); celebrate(); break;
    case 'edit': view = 'edit'; render(); scrollTo(0, 0); break;
    case 'editdone': view = 'today'; viewDay = todayKey(); render(); scrollTo(0, 0); snap = takeSnap(); break;
    case 'wsave': saveWeight(el.dataset.k, $('#wW').value, $('#wWaist').value); break;
    case 'rsave': saveWeight($('#rDate').value || todayKey(), $('#rW').value, $('#rWaist').value); break;
    case 'rdel': if (confirm(`删除 ${fmtMD(el.dataset.k)} 的记录？`)) { delete S.weights[el.dataset.k]; save(); render(); } break;
    case 'export': doExport(); break;
    case 'copy': copyExport(); break;
    case 'importText': doImport($('#importBox').value); break;
    case 'reset': if (confirm('确定清空全部数据？此操作不能恢复。') && prompt('请输入「清空」两个字确认') === '清空') { S = blank(); save(); toast('已清空', '重新开始吧 💪'); view = 'today'; viewDay = todayKey(); render(); snap = takeSnap(); } break;
  }
});
// 左右滑动换天（今天页）
let swipeX0 = null, swipeY0 = null, swipeT0 = 0;
document.addEventListener('touchstart', ev => {
  if (view !== 'today' || sheetOpen() || isTyping()) { swipeX0 = null; return; }
  if (ev.target.closest('input,textarea,button,.slot,.piano,.sheet')) { swipeX0 = null; return; }
  const t = ev.changedTouches[0]; swipeX0 = t.clientX; swipeY0 = t.clientY; swipeT0 = Date.now();
}, { passive: true });
document.addEventListener('touchend', ev => {
  if (swipeX0 == null || view !== 'today') return;
  const t = ev.changedTouches[0], dx = t.clientX - swipeX0, dy = t.clientY - swipeY0, dt = Date.now() - swipeT0;
  swipeX0 = null;
  if (dt > 600 || Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  shiftDay(dx < 0 ? 1 : -1);
}, { passive: true });

function stopTimer() {
  const t = S.timer; if (!t) return;
  let ms = timerMs();
  if (ms > 3 * 3600e3) { const v = prompt(`计时已经 ${Math.round(ms / 60e3)} 分钟，是不是忘了停？\n请输入实际练琴分钟数：`, '60'); if (v === null) return; ms = Math.max(0, +v || 0) * 60e3; }
  const day = t.day;
  const id = timerId(), tt = tasksFor(day).find(x => x.id === id), name = tt ? tt.title : '练琴';
  mutate(day, () => { const r = dayRec(day); S.timer = null; addSec(r, id, ms / 1000); }, '#pRing_' + id);
  if (!$('.toast.show')) toast(`${tt && tt.icon ? tt.icon : '🎹'} 本次${name} ${Math.round(ms / 60e3)} 分钟`, `今天累计 ${Math.floor(taskSec(day, id) / 60)} 分钟`);
}
function saveWeight(k, w, waist) {
  w = parseFloat(w); waist = parseFloat(waist);
  const okW = w > 50 && w < 400, okA = waist > 40 && waist < 200;
  if (!okW && !okA) { toast('请输入体重（斤）或腰围（cm）'); return; }
  if (!k || isFutureDay(k)) { toast('👀 这是预览', '到当天再记录'); return; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const old = S.weights[k] || {};
  mutate(k, () => { S.weights[k] = { w: okW ? w : old.w, waist: okA ? waist : old.waist }; }, '[data-act="wsave"],[data-act="rsave"]');
  if (!$('.toast.show')) toast('✅ 已记录', `${fmtMD(k)} ${S.weights[k].w ? S.weights[k].w + ' 斤' : ''} ${S.weights[k].waist ? S.weights[k].waist + ' cm' : ''}`);
}
const backupJSON = () => JSON.stringify({ app: 'daily-checkin', version: 2, exportedAt: new Date(now()).toISOString(), data: S, config: CFG });
async function doExport() {
  const txt = backupJSON(), name = `每日打卡备份-${todayKey()}.json`;
  try {
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  exportText = txt; render(); toast('已导出', '如果没有下载，可复制下面的文本');
}
async function copyExport() {
  exportText = backupJSON(); render();
  try { await navigator.clipboard.writeText(exportText); toast('📋 已复制', '粘贴到微信「文件传输助手」保存'); }
  catch (e) { const b = $('#exportBox'); if (b) { b.focus(); b.select(); } toast('请长按文本框全选复制'); }
}
function doImport(txt) {
  let d;
  try { const o = JSON.parse(txt); d = o && o.data ? o.data : o; if (!d || typeof d.days !== 'object') throw 0; }
  catch (e) { toast('❌ 备份格式不对', '请确认是本 App 导出的内容'); return; }
  let o = null; try { o = JSON.parse(txt); } catch (e) {}
  const hasCfg = o && validCfg(o.config);
  if (!confirm(`恢复备份会覆盖当前数据（备份里有 ${Object.keys(d.days).length} 天打卡${hasCfg ? '，以及自定义的分类和任务' : ''}）。继续？`)) return;
  S = { ...blank(), ...d }; save();
  if (hasCfg) { CFG = o.config; CFG.versions.sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0); saveCfg(); cfgChanged(); } toast('✅ 恢复成功'); view = 'today'; viewDay = todayKey(); render(); snap = takeSnap();
}

// 定时刷新：计时器每秒走；每分钟刷新「现在 / 未完成」状态；跨天自动切换
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'); };
let lastMin = Math.floor(now() / 60e3), lastDay = todayKey();
setInterval(() => {
  const tk = todayKey();
  if (tk !== lastDay) { if (viewDay === lastDay) viewDay = tk; lastDay = tk; cfgChanged(); if (!isTyping()) render(); snap = takeSnap(); return; }
  if (S.timer && S.timer.startTs && view === 'today' && viewDay === S.timer.day) {
    const lv = $('#pLive'), pm = $('#pMin');
    if (lv) lv.textContent = '● ' + fmtDur(timerMs());
    if (pm && +pm.textContent !== Math.floor(taskSec(viewDay, timerId()) / 60) && !isTyping() && !sheetOpen()) { render(); celebrate(); }
  }
  const mm = Math.floor(now() / 60e3);
  if (mm !== lastMin) { lastMin = mm; if (!isTyping() && view !== 'settings' && view !== 'edit') render(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isTyping() && !sheetOpen()) { load(); loadCfg(); if (todayKey() !== lastDay) { lastDay = todayKey(); viewDay = lastDay; } render(); celebrate(); } });
addEventListener('resize', () => { if (raf) sizeFx(); });

load(); loadCfg(); render(); snap = takeSnap(); celebrate();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !clockOffset) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
